<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>
</head>
<body>
    <h1>Constructor Functions</h1>
    <div id="create_heading">
        <form id="account_form">
            <input type="text" placeholder="Enter Name" id="customer_name"/>
            <input type="number" placeholder="Initial Balance" id="balance"/>
            <button >Create an account</button>
        </form>
        <hr/>
        <form id="deposit_form">
            <input type="number" placeholder="Account Number" id="account_number"/>
            <input type="number" placeholder="Deposit" id="deposit"/>
            <input type="number" placeholder="WithDrawl" id="with_drawl"/>
            <button >Submit</button>
        </form>
    </div>
</body>
